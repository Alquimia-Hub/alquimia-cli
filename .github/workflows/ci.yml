name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The published bin is launched by Node (that is how `npx` works), so
      # prove it still boots the CLI on a machine that only has Node.
      - name: Smoke the npx bootstrap
        run: node bin/alquimia.js version
